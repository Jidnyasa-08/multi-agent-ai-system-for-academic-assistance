<!DOCTYPE html>
<html>

<head>
    <title>Academic Assistant Application</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        input {
            width: 75%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #2980b9;
        }

        #chatBox {
            margin-top: 20px;
            border: 1px solid #ddd;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            border-radius: 5px;
            background: #fafafa;
        }

        .user {
            text-align: right;
            margin: 10px;
        }

        .user-message {
            display: inline-block;
            background: #d1ecf1;
            padding: 10px;
            border-radius: 10px;
        }

        .bot {
            text-align: left;
            margin: 10px;
        }

        .bot-message {
            display: inline-block;
            background: #d4edda;
            padding: 10px;
            border-radius: 10px;
            white-space: pre-line;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🎓 Academic Assistant Application</h1>

        <input
            type="text"
            id="question"
            placeholder="Ask your academic question..."
        >

        <button onclick="sendQuestion()">
            Submit
        </button>

        <div id="chatBox"></div>

    </div>

    <script>

        async function sendQuestion() {

            const question =
                document.getElementById("question").value;

            if (question.trim() === "") {
                return;
            }

            const chatBox =
                document.getElementById("chatBox");

            chatBox.innerHTML +=
                "<div class='user'><div class='user-message'><b>You:</b> "
                + question +
                "</div></div>";

            try {

                const response = await fetch(
                    "http://127.0.0.1:5000/api/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            question: question
                        })
                    }
                );

                const data = await response.json();

                chatBox.innerHTML +=
                    "<div class='bot'><div class='bot-message'><b>"
                    + data.agent +
                    "</b><br><br>"
                    + data.answer +
                    "</div></div>";

            }

            catch (error) {

                chatBox.innerHTML +=
                    "<div class='bot'><div class='bot-message'>Error connecting to backend.</div></div>";
            }

            document.getElementById("question").value = "";

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.getElementById("question")
        .addEventListener("keypress", function(event) {

            if (event.key === "Enter") {
                sendQuestion();
            }

        });

    </script>

</body>

</html>
